name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow pyyaml
      - name: Syntax check
        run: python -m py_compile scientific-asset-reconstruction/scripts/*.py
      - name: Frontmatter sanity
        run: |
          python - <<'PY'
          import re, yaml
          md = open("scientific-asset-reconstruction/SKILL.md", encoding="utf-8").read()
          fm = yaml.safe_load(re.match(r"^---\n(.*?)\n---\n", md, re.S).group(1))
          assert fm["name"] == "scientific-asset-reconstruction", fm["name"]
          assert len(fm["description"]) <= 1024
          assert len(fm["compatibility"]) <= 500
          print("frontmatter OK:", fm["metadata"].get("version"))
          PY
      - name: Audit smoke test on the example assets
        run: |
          python scientific-asset-reconstruction/scripts/audit_assets.py docs/examples/assets --out /tmp/audit_example --target 1024
